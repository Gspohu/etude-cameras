[workspace]
members = ["core", "py", "wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[workspace.lints.rust]
unused_parens = "allow"

[workspace.lints.clippy]
double_parens = "allow"
needless_return = "allow"
