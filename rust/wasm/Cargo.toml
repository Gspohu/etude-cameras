[package]
name = "champ_wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
champ_core = { path = "../core" }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

[lints.rust]
unused_parens = "allow"

[lints.clippy]
double_parens = "allow"
needless_return = "allow"
