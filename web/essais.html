<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Essais du moteur web</title>
</head>
<body>
<pre id="sortie">essais en cours...</pre>

<script type="module">
import init, { analyser, catalogue_defaut, charger_catalogue, charger_plan, placer, plan_defaut,
               plan_vers_yaml } from "./pkg/champ.js";
import { ajouterCamera, appliquerTouche, attraper, camera, deplacer, relacher, supprimerCamera,
         tourner } from "./edition.js";

const resultats = [];

function verifier(nom, condition, detail = "")
{
    resultats.push(`${condition ? "OK  " : "RATE"} ${nom}${detail ? " : " + detail : ""}`);
}

function proche(a, b, tolerance = 0.05)
{
    return Math.abs(a - b) <= tolerance;
}

async function lancer()
{
    await init();
    const catalogueJson = charger_catalogue(catalogue_defaut());
    const catalogue = JSON.parse(catalogueJson);
    verifier("portées de la Dahua 2,8 mm",
             catalogue["dahua-2441-28"].portees.map((p) => Math.round(p * 10) / 10)
                 .join(" ") === "49.3 19.7 9.9 4.9",
             catalogue["dahua-2441-28"].portees.map((p) => p.toFixed(1)).join(" "));

    const plan = JSON.parse(charger_plan(plan_defaut(), catalogueJson, "Exemple"));
    const requete = (p, nuit = false) => JSON.stringify({ plan: p, catalogue, nuit });
    const resume = JSON.parse(analyser(requete(plan)).resume);
    const st = resume.statistiques;

    // the very numbers the Python command line prints on the same plan
    verifier("surface surveillée", proche(st.surface_m2, 218.7), st.surface_m2.toFixed(1));
    verifier("surfaces DORI",
             [74.7, 74.7, 73.5, 27.68].every((v, i) => proche(st.au_moins_m2[i], v)),
             st.au_moins_m2.map((v) => v.toFixed(1)).join(" "));
    verifier("verdicts", resume.verdicts.every((v) => v.ok),
             resume.verdicts.map((v) => `${v.nom}=${v.ok}`).join(" "));

    // un plan sans caméra : chaque point manque, et chacun porte son conseil
    const orphelin = JSON.parse(JSON.stringify(plan));
    orphelin.cameras = [];
    const nu = JSON.parse(analyser(requete(orphelin)).resume);
    verifier("conseil quand rien ne couvre",
             nu.verdicts.every((v) => !v.ok && v.conseil),
             nu.verdicts.map((v) => v.conseil).join(" | "));
    verifier("aucune camera ne filme dehors",
             resume.conformite.every((c) => c.conforme),
             resume.conformite.map((c) => `${c.camera}=${c.debordement_m2.toFixed(1)}`).join(" "));
    verifier("mention du statut", resume.mention === "COTES ESTIMEES", String(resume.mention));

    // an IR range of one metre leaves only what sits against the camera
    const myope = JSON.parse(JSON.stringify(catalogue));
    Object.values(myope).forEach((m) => { m.portee_ir_m = 1.0; });
    const nuit = JSON.parse(analyser(JSON.stringify({ plan, catalogue: myope, nuit: true })).resume);
    verifier("la nuit coupe à la portée IR",
             nuit.statistiques.au_moins_m2[0] < 0.02 * st.au_moins_m2[0],
             `${nuit.statistiques.au_moins_m2[0].toFixed(2)} contre ${st.au_moins_m2[0].toFixed(1)}`);

    // scripted editing session, the same keys the page binds
    const etat = { plan: JSON.parse(JSON.stringify(plan)), clesModeles: Object.keys(catalogue).sort(),
                   selection: 0, nuit: false, glisse: false };
    const cible = etat.plan.cameras[1];
    verifier("attraper la caméra visée", attraper(etat, cible.x + 0.3, cible.y - 0.3) === 1);
    deplacer(etat, 10, 18);
    relacher(etat);
    verifier("glisser-déposer", camera(etat).x === 10 && camera(etat).y === 18,
             `${camera(etat).x} ${camera(etat).y}`);
    verifier("le relâchement fige", !deplacer(etat, 0, 0));
    const azimut = camera(etat).azimut;
    tourner(etat, 5);
    verifier("molette", camera(etat).azimut === (azimut + 5) % 360);
    appliquerTouche(etat, "ArrowLeft", true);
    verifier("flèche au degré", camera(etat).azimut === (azimut + 4) % 360);
    const modele = camera(etat).modele;
    appliquerTouche(etat, "m");
    appliquerTouche(etat, "M");
    verifier("modèle suivant puis précédent", camera(etat).modele === modele);
    verifier("jour et nuit", appliquerTouche(etat, "n") === "recalculer" && etat.nuit);
    verifier("touche d'export", appliquerTouche(etat, "e") === "exporter");
    verifier("touche inconnue ignorée", appliquerTouche(etat, "z") === null);

    // ajout et retrait, le nombre de caméras n'est plus figé par le plan chargé
    const combien = etat.plan.cameras.length;
    const neuve = ajouterCamera(etat);
    verifier("une caméra de plus", etat.plan.cameras.length === combien + 1
             && camera(etat).nom === neuve.nom, neuve.nom);
    verifier("elle tombe dans la parcelle",
             neuve.x > 0 && neuve.x < 28 && neuve.y > 0 && neuve.y < 22,
             `${neuve.x} ${neuve.y}`);
    verifier("son nom est libre",
             new Set(etat.plan.cameras.map((c) => c.nom)).size === etat.plan.cameras.length);
    verifier("retrait", supprimerCamera(etat) && etat.plan.cameras.length === combien);
    const vide = JSON.parse(JSON.stringify(etat));
    vide.plan.cameras = [];
    verifier("retirer d'un plan vide ne casse rien", supprimerCamera(vide) === false);

    const yaml = plan_vers_yaml(JSON.stringify(etat.plan));
    verifier("export YAML relisible",
             JSON.parse(charger_plan(yaml, catalogueJson, "relu")).cameras.length === 2);

    // an invalid plan must be refused with a readable message
    let message = "";
    try
    {
        charger_plan("limite: [[0,0],[1,0],[1,1]]\ncameras:\n  - {nom: a, modele: bidon, "
                     + "position: [0,0], hauteur: 2, azimut: 0}\n", catalogueJson, "x");
    }
    catch (e)
    {
        message = String(e.message || e);
    }
    verifier("modèle inconnu refusé", message.includes("absent du catalogue"), message);

    // the search the worker carries, called here in line : a worker never answers
    // under the virtual clock this page is driven with
    const proposition = JSON.parse(placer(JSON.stringify(
        { plan, catalogue, modeles: ["dahua-2441-28"], nb_cameras: 1, pas_grille: 0.8,
          pas_azimut: 90, hauteurs: [2.2], inclinaisons: [30] })));
    verifier("le solveur propose une pose", proposition.poses.length === 1,
             String(proposition.poses.length));
    const propose = JSON.parse(JSON.stringify(plan));
    propose.cameras = proposition.poses;
    const verdict = JSON.parse(analyser(requete(propose, false)).resume);
    verifier("elle ne filme pas dehors", verdict.conformite.every((c) => c.conforme),
             verdict.conformite.map((c) => c.debordement_m2.toFixed(2)).join(" "));

    const rates = resultats.filter((r) => r.startsWith("RATE")).length;
    document.getElementById("sortie").textContent =
        resultats.join("\n") + `\n\nBILAN ${resultats.length - rates}/${resultats.length}`;
}

lancer().catch((e) =>
{
    document.getElementById("sortie").textContent = `RATE exception : ${e.message || e}\n${e.stack}`;
});
</script>
</body>
</html>
