# Parcelle AN 164, Séné (56), relevée sur le plan de masse coté DP2 au 1/200
#
# Les quatre limites portent leurs cotes sur le plan : 26,8 m au nord, 15,6 m à
# l'est, 10,3 m au sud-est, 27,7 m au sud-ouest. Le polygone ci-dessous les
# restitue à moins de 40 cm, ce qui est la limite d'une lecture sur capture
# d'écran, d'où le statut. Le projet, lui, est posé sur ses propres cotes.
#
# Axes : x vers l'est, y vers le nord, métres. Origine au coin ouest de la
# parcelle pour x, au coin sud pour y
# azimut : degrés horaires depuis +y (0 nord, 90 est, 180 sud)

nom: Séné AN 164
statut: plan
hauteur_cible: 1.6
pas: 0.1

limite: [[0.00, 19.97], [26.72, 20.83], [28.02, 5.66], [19.70, 0.00]]

obstacles:
  # Le projet : toit terrasse, acrotère à 16,18 NGF pour un terrain à 12,85
  - nom: le projet
    type: batiment
    hauteur: 3.33
    points: [[10.98, 20.61], [17.43, 20.61], [17.43, 12.25],
             [13.04, 12.25], [13.04, 16.00], [10.98, 16.00]]

  # Le plan ne donne aucune hauteur pour l'existant : 6 m est une supposition,
  # à remplacer par la cote réelle. Emprise simplifiée en un rectangle
  - nom: la maison existante
    type: batiment
    hauteur: 6.0
    points: [[17.43, 20.83], [23.65, 20.83], [23.65, 7.07], [17.43, 7.07]]

cameras:
  # Les deux vue du plan sont les points de prise de vue du dossier
  # d'urbanisme, pas des points de fixation. Ces deux poses sont une
  # proposition, sur les façades, conformément au raccordement PoE de l'étude
  - nom: acces
    modele: dahua-2441-28
    position: [23.90, 15.40]
    hauteur: 2.8
    azimut: 40
    inclinaison: 12

  - nom: jardin
    modele: dahua-2441-28
    position: [10.75, 20.20]
    hauteur: 2.8
    azimut: 220
    inclinaison: 12

points_passage:
  # L'accès est porté sur le plan, au nord-est
  - nom: acces
    position: [24.74, 19.53]
    requis: identifier

  - nom: fond de parcelle
    position: [19.00, 2.50]
    requis: detecter
