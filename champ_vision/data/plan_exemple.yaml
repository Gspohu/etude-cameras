# Parcelle AN 164, Séné (56), relevée sur le plan de masse coté DP2 au 1/200
#
# Les quatre limites portent leurs cotes sur le plan : 26,8 m au nord, 15,6 m à
# l'est, 10,3 m au sud-est, 27,7 m au sud-ouest. Le polygone ci-dessous les
# restitue à moins de 40 cm, ce qui est la limite d'une lecture sur capture
# d'écran, d'où le statut. Le projet, lui, est posé sur ses propres cotes.
#
# Axes : x vers l'est, y vers le nord, métres. Origine au coin ouest de la
# parcelle pour x, au coin sud pour y
# azimut : degrés horaires depuis +y (0 nord, 90 est, 180 sud)

nom: Séné AN 164
statut: plan
hauteur_cible: 1.6
pas: 0.1

limite: [[0.00, 19.74], [26.76, 21.18], [28.07, 5.64], [19.43, 0.00]]

# bande observée au delà de la limite, pour peser ce qui est filmé dehors
marge_hors: 12.0

obstacles:
  # Clôture opaque de 2 m sur tout le pourtour : c'est elle qui décide de ce
  # qu'une caméra attrape chez le voisin ou sur la voie
  - nom: la clôture
    type: cloture
    hauteur: 2.0
    opaque: true
    ferme: true
    points: [[0.00, 19.74], [26.76, 21.18], [28.07, 5.64], [19.43, 0.00]]

  # Le projet : toit terrasse, acrotère à 16,18 NGF pour un terrain à 12,85
  - nom: le projet
    type: batiment
    hauteur: 3.33
    points: [[10.98, 20.61], [17.43, 20.61], [17.43, 12.25],
             [13.04, 12.25], [13.04, 16.00], [10.98, 16.00]]

  # Le plan ne donne aucune hauteur pour l'existant : 6 m est une supposition,
  # à remplacer par la cote réelle. Emprise simplifiée en un rectangle
  - nom: la maison existante
    type: batiment
    hauteur: 6.0
    points: [[17.43, 20.83], [23.65, 20.83], [23.65, 7.07], [17.43, 7.07]]

  # Cabanon de 5 x 4 m calé dans l'angle aigu, le long de la limite nord, reculé
  # jusqu'à ce que son coin arrière touche la limite sud-ouest. Le cadastre le
  # dessine décalé, les cotes viennent du terrain
  - nom: le cabanon
    type: batiment
    hauteur: 2.0
    points: [[3.53, 19.93], [8.52, 20.20], [8.74, 16.20], [3.74, 15.94]]

cameras:
  # Poses sorties de " placer --budget 200 --modeles dahua-2441-28 ", soit la
  # contrainte de l'étude : 43 200 essais, 7 034 candidats conformes au droit,
  # deux caméras à 183 € qui tiennent les deux points de passage
  #
  # À 2,2 m et 30 degrés de plongé la clôture de 2 m ne laisse rien passer
  # dehors, ce qu'une caméra à 2,8 m ne permetait plus
  - nom: nord-est
    modele: dahua-2441-28
    position: [23.90, 20.83]
    hauteur: 2.2
    azimut: 190
    inclinaison: 30

  - nom: sud
    modele: dahua-2441-28
    position: [17.18, 7.07]
    hauteur: 2.2
    azimut: 130
    inclinaison: 30

points_passage:
  # L'accès est porté sur le plan, au nord-est
  - nom: acces
    position: [24.74, 19.53]
    requis: identifier

  - nom: fond de parcelle
    position: [19.00, 2.50]
    requis: detecter
